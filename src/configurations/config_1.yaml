name: RNN_simple
version: 0.0.1

architecture: 
  type: "RNN"
  hidden: 20


hyperparameters:
  batch_size: 32
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  optimizer: "SGD"
  loss: "MSELoss"
  epoches: 3

window:
  past: int
  forecast: int

files:
  training: "./data/csv_files/field_f1"
  test: "./data/csv_files/field_f2"

features:
  input:
    fiedls: ['s_b','s_w','LAI','irr']
    meteo_historical: ['temperature_2m','relative_humidity_2m','cloud_cover','wind_speed_10m','wind_direction_100m','soil_temperature_0_to_7cm','soil_temperature_7_to_28cm','soil_temperature_28_to_100cm','rain','precipitation','evapotranspiration']
    meteo_forecast: ['temperature_2m_f','relative_humidity_2m_f','cloud_cover_f','wind_speed_10m_f','wind_direction_10m_f','soil_temperature_0cm_f','soil_temperature_6cm_f','soil_temperature_18cm_f','rain_f']
  output: ['s_b','s_w']
  input_seq_len: 70
  output_seq_len: 24
  shift: 0

